name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check abus tests scripts install.py uninstall.py
      - run: uv run ruff format --check abus tests scripts install.py uninstall.py
      - run: uv run pytest -q -rs
      - run: uv build
      - name: Verify runtime lock export
        run: |
          uv export --no-dev --no-emit-project --frozen --format requirements-txt --output-file /tmp/abus-requirements.txt
          diff <(tail -n +3 requirements.lock) <(tail -n +3 /tmp/abus-requirements.txt)
